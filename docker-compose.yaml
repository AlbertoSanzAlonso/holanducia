version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: holanducia_postgres
    restart: always
    environment:
      POSTGRES_USER: holanducia
      POSTGRES_PASSWORD: holanducia
      POSTGRES_DB: holanducia
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U holanducia -d holanducia"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: holanducia_api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://holanducia:holanducia@postgres:5432/holanducia
      REDIS_HOST: redis
      PYTHONPATH: /app:/app/scrapers
    ports:
      - "9000:8000"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: holanducia_worker
    restart: always
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+asyncpg://holanducia:holanducia@postgres:5432/holanducia
      API_URL: http://api:8000
      REDIS_HOST: redis
      SNIPER_BACKEND: crawl4ai
      PYTHONPATH: /app:/app/scrapers
    command: ["python", "scrapers/main.py"]

  redis:
    image: redis:alpine
    container_name: holanducia_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data:

networks:
  default:
    name: holanducia_network
